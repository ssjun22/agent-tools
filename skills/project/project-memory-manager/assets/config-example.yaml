# project-memory-manager 설정 파일
#
# 이 파일을 ~/.claude/project-memory-config.yaml로 복사하여 사용하세요.
#
# 사용법:
#   cp assets/config-example.yaml ~/.claude/project-memory-config.yaml
#   # 아래 경로를 실제 프로젝트 경로로 수정

projects:
  # 프로젝트 1 예시
  - name: "톡톡 평가"
    alias: ["talktalk", "톡톡", "talktalk-eval"]

    # Obsidian vault 경로 (맥락 + 비즈니스 도메인 관리)
    obsidian_path: "/Users/choiyoungjun/Documents/Obsidian Vault/daekyo/projects"

    # 코드 레포지토리 경로 (OpenSpec)
    repo_path: "/Users/choiyoungjun/knowre/talktalk-eval"

    # OpenSpec 사용 여부
    use_openspec: true

    # 기본 회의 타입
    default_meeting_types: ["dev", "meeting", "cto-review"]

  # 프로젝트 2 예시
  - name: "다른 프로젝트"
    alias: ["project2", "프로젝트2"]
    obsidian_path: "/path/to/obsidian/vault/project2"
    repo_path: "/path/to/code/project2"
    use_openspec: false
    default_meeting_types: ["meeting", "review"]

# 각 프로젝트의 Obsidian 디렉토리에 다음 구조가 생성됩니다:
# - PROJECT.md (중앙 인덱스)
# - domain/ (비즈니스 도메인: user/, evaluation/, lesson/ 등)
# - meetings/ (회의록/결정: YYYY-MM-DD-type.md)
#
# OpenSpec은 코드 레포지토리의 openspec/ 디렉토리에서 관리됩니다.
